<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSC Textiles — Sign In</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { width: 100%; max-width: 380px; box-shadow: var(--shadow-lg); }
  .login-logo { text-align: center; margin-bottom: 4px; }
  .login-logo img { height: 46px; }
  .login-title { text-align: center; font-size: 15px; font-weight: 800; color: var(--navy); margin: 10px 0 2px; }
  .login-sub { text-align: center; font-size: 11px; color: var(--muted); margin-bottom: 16px; }
</style>
</head>
<body>

<div class="card login-card">
  <div class="login-logo"><img src="https://bsctextilescandb-ui.github.io/retail-crm/logo.jpg" alt="BSC"></div>
  <div class="login-title">BSC Textiles — Daily Attendance</div>
  <div class="login-sub">Sign in with your PIN</div>

  <div class="fg">
    <label>PIN</label>
    <input type="password" id="pin" placeholder="Enter your PIN" onkeydown="if(event.key==='Enter')withBtn(document.getElementById('continueBtn'), doLogin)">
  </div>
  <button class="btn btn-primary btn-full" id="continueBtn" style="margin-top:14px;" onclick="withBtn(this, doLogin)">Continue</button>
  <div id="msg"></div>
</div>

<script src="shared.js"></script>
<script>
(function () {
  const s = getSession();
  if (s) routeAfterLogin(s);
})();

async function doLogin() {
  const pin = document.getElementById('pin').value.trim();
  const msgEl = document.getElementById('msg');
  msgEl.innerHTML = '';
  if (!pin) { msgEl.innerHTML = '<div class="msg msg-err">Enter your PIN.</div>'; return; }

  let res;
  try {
    res = await jsonpCall({ action: 'identify', pin });
  } catch (err) {
    msgEl.innerHTML = '<div class="msg msg-err">' + err.message + '</div>';
    return;
  }
  if (res.error) { msgEl.innerHTML = '<div class="msg msg-err">' + res.error + '</div>'; return; }

  saveSession(res);
  clearSelectedUnit();
  routeAfterLogin(res);
}

function routeAfterLogin(session) {
  window.location.href = session.role === 'Admin' ? 'dashboard.html' : 'marking.html';
}
</script>

</body>
</html>
